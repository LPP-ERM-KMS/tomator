name: t1dl-env
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python>=3.10
  
  # FEniCSx / dolfinx
  - fenics-dolfinx>=0.7
  - petsc4py
  - mpi4py
  
  # Scientific computing
  - numpy
  - scipy
  
  # Utilities
  - pip
  
  # Optional: for plotting/analysis
  - matplotlib
  - pandas
  - bokeh
